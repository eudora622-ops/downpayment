<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購屋能力試算 | 台南寶家・徐甯恩</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPCS2EQRTC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CPCS2EQRTC');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?ixlib=rb-4.0.3&auto=format&fit=crop&w=2053&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a202c;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .input-label { display: block; color: #334155; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .input-field { 
            width: 100%; padding: 12px; 
            background-color: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 1.1rem; 
            outline: none; 
            transition: all 0.2s; 
        }
        .input-field:focus { 
            border-color: #b45309;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1); 
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        .price-input {
            background: #fff9f2;
            border: 2px solid #fed7aa;
            border-radius: 12px;
            color: #1e293b;
            padding: 8px;
            text-align: center;
            transition: all 0.3s;
        }
        .price-input:focus {
            border-color: #b45309;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(180, 83, 9, 0.1);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #b45309;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; background: #cbd5e1; border-radius: 2px;
        }
        .line-link {
            color: #4b5563;
            background-color: #e2e8f0;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .line-link:hover { background-color: #79d03d; color: white; transform: translateY(-2px); }
        .btn-gold {
            background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
            color: white; font-weight: bold; padding: 12px 20px; border-radius: 10px;
            transition: all 0.3s; text-align: center; display: block; width: 100%;
        }
        .btn-gold:hover { transform: translateY(-2px); }

        /* 超過還款能力時的警示樣式 */
        .over-limit {
            background-color: #fee2e2 !important; 
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="fixed inset-0 bg-slate-900/70 z-0"></div>

    <div x-data="{ ...calculator(), showForm: false }" x-init="initCalc()" class="relative z-10 w-full max-w-[480px]">
        
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-32 h-auto mb-1 transform hover:scale-105 transition-transform duration-300">
                <img src="logo.png" alt="JIA LABEL Logo" class="w-full h-full object-contain drop-shadow-lg" onerror="this.parentElement.innerHTML='<span class=\'text-sm text-center text-red-400 bg-white/10 px-2 py-1 rounded\'>Logo</span>'">
            </div>
            
            <div class="mb-4">
                <p class="text-white/90 text-base font-medium tracking-wider drop-shadow-md">台南寶家・台灣房屋</p>
                <div class="flex justify-center items-center gap-4 mt-1">
                    <p class="text-amber-400 font-bold text-4xl tracking-widest drop-shadow-lg">徐甯恩</p>
                    <a href="https://line.me/ti/p/~eudora622" target="_blank" class="line-link shadow-lg">更多諮詢</a>
                </div>
                <p class="text-slate-200 text-sm mt-1 font-normal tracking-wider drop-shadow">專營預售屋 / 新成屋 / 建商保留戶</p>
            </div>

            <h1 class="text-white text-3xl font-bold tracking-wide text-shadow drop-shadow-xl mt-1">購屋能力試算</h1>
            <div class="h-1.5 w-20 bg-gradient-to-r from-amber-500 to-amber-600 rounded-full mt-2 mx-auto"></div>
        </div>

        <div class="glass-card p-6 md:p-8 shadow-2xl">
            <div class="space-y-5">
                <div>
                    <label class="input-label">💰 目前月薪 (實領)</label>
                    <input type="number" x-model.number="salary" @input="calculateFromSalary()" class="input-field font-bold text-slate-700">
                </div>
                <div>
                    <label class="input-label">💳 每月貸款支出 (車貸/信貸)</label>
                    <input type="number" x-model.number="monthlyDebt" @input="calculateFromSalary()" class="input-field">
                </div>
                
                <div>
                    <label class="input-label">📉 預計房貸利率 (%)</label>
                    <input type="number" x-model.number="interestRate" @input="updateResults()" step="0.1" class="input-field">
                </div>

                <div class="pt-2">
                    <label class="input-label flex justify-between">
                        <span>🏦 預計貸款成數</span>
                        <span class="text-amber-700 font-bold" x-text="loanPercentage + ' 成'"></span>
                    </label>
                    <input type="range" min="50" max="85" step="5" x-model.number="loanPercentage" @input="updateResults()" class="w-full mt-2">
                </div>

                <div>
                    <label class="input-label flex justify-between">
                        <span>⏳ 貸款年限</span>
                        <span class="text-amber-700 font-bold" x-text="years + ' 年'"></span>
                    </label>
                    <input type="range" min="20" max="40" step="5" x-model.number="years" @input="updateResults()" class="w-full mt-2">
                </div>
            </div>

            <hr class="border-dashed border-slate-300 my-6">

            <div class="text-center">
                <p class="text-xs text-slate-500 uppercase tracking-widest mb-1">Estimated Budget</p>
                <h2 class="text-lg font-bold text-slate-700 mb-2">建議房屋總價</h2>
                
                <div class="flex items-center justify-center gap-2">
                    <input type="number" x-model.number="totalPrice" @input="updateResults()" 
                           class="price-input w-40 text-4xl font-extrabold outline-none">
                    <span class="text-2xl text-slate-500 font-normal">萬</span>
                </div>
                
                <div class="bg-amber-50 rounded-xl p-4 mt-6 border border-amber-100 shadow-sm">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-sm text-slate-500">建議準備自備款</span>
                        <span class="text-xl font-bold text-emerald-600" x-text="'$ ' + formatNumber(totalCashNeeded) + ' 萬'"></span>
                    </div>
                    <div class="text-[11px] text-slate-400 text-right italic font-medium">(含2%仲介費，不含雜項支出)</div>
                </div>

                <div class="space-y-3 mt-4">
                    <div class="bg-slate-50 p-3 rounded-lg flex justify-between items-center border border-slate-200 shadow-inner">
                        <p class="text-sm text-slate-500 font-medium">銀行核貸金額</p>
                        <p class="font-bold text-slate-700 text-lg" x-text="formatNumber(loanAmount) + ' 萬'"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-inner text-left">
                            <p class="text-[10px] text-slate-400 font-bold mb-1">建議月繳上限</p>
                            <p class="font-bold text-slate-600 text-base" x-text="'$' + formatNumber(maxAffordablePayment)"></p>
                        </div>
                        <div class="p-3 rounded-lg border transition-all duration-300 text-left" 
                             :class="actualMonthlyPayment > maxAffordablePayment ? 'over-limit' : 'bg-amber-50 border-amber-100 shadow-inner'">
                            <p class="text-[10px] font-bold mb-1" :class="actualMonthlyPayment > maxAffordablePayment ? 'text-red-600' : 'text-amber-600'">試算月繳金額</p>
                            <p class="font-bold text-lg" x-text="'$' + formatNumber(actualMonthlyPayment)"></p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button @click="showForm = true" class="btn-gold text-lg shadow-xl hover:scale-[1.02]">📝 索取更詳細的購屋評估</button>
                    <p class="text-xs text-slate-400 mt-3 font-medium">由 徐甯恩 為您進行精準媒合</p>
                </div>
            </div>
        </div>

        <div class="mt-10 text-center pb-8">
            <p class="text-white/70 text-sm font-light tracking-wider flex justify-center items-center">台南市北區北安路一段271號</p>
            <p class="text-white/40 text-[10px] font-mono tracking-widest uppercase mt-4">© 2026 Jia Label. All Rights Reserved.</p>
        </div>

        <div x-show="showForm" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center px-4" x-transition.opacity>
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" @click="showForm = false"></div>
            <div class="bg-white rounded-2xl w-full max-w-md relative z-10 p-6 shadow-2xl overflow-y-auto max-h-[95vh]">
                <button @click="showForm = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <h3 class="text-xl font-bold text-slate-800 mb-2 text-center">購屋需求詳細評估</h3>
                <p class="text-xs text-slate-500 text-center mb-4">請填寫以下資訊，我們將儘快為您提供建議物件</p>
                
                <form action="https://formspree.io/f/mpqznezj" method="POST" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">姓名 *</label>
                            <input type="text" name="姓名" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">電話 *</label>
                            <input type="tel" name="電話" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">LINE ID</label>
                            <input type="text" name="LineID" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">購買區域</label>
                            <input type="text" name="購買區域" placeholder="如：安南、北區" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">總價預算 (萬)</label>
                            <input type="text" name="總價預算" :value="totalPrice" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-slate-50 font-bold">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-600 mb-1 block">自備款 (萬)</label>
                            <input type="text" name="自備款" :value="totalCashNeeded" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-slate-50 font-bold">
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-slate-600 mb-1 block">屋齡偏好</label>
                        <select name="屋齡偏好" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-white">
                            <option value="預售屋">預售屋</option>
                            <option value="新成屋 (5年內)">新成屋 (5年內)</option>
                            <option value="中古屋 (10-20年)">中古屋 (10-20年)</option>
                            <option value="不限">不限</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-slate-600 mb-1 block">備註或其他需求</label>
                        <textarea name="備註" rows="2" placeholder="如：房型需求、特定學區" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none border-slate-300 focus:ring-2 focus:ring-amber-500"></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transition-colors shadow-lg">送出評估需求</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function calculator() {
            return {
                salary: 60000,
                monthlyDebt: 0,
                loanPercentage: 80, 
                years: 30,
                interestRate: 2.6, 
                totalPrice: 0,
                loanAmount: 0,
                maxAffordablePayment: 0, 
                actualMonthlyPayment: 0, 
                totalCashNeeded: 0,
                downPayment: 0,
                agentFee: 0,

                formatNumber(num) {
                    if (!num) return 0;
                    return new Intl.NumberFormat('zh-TW').format(Math.round(num));
                },
                initCalc() { this.calculateFromSalary(); },
                calculateFromSalary() {
                    const maxDTI = 0.6;
                    let available = (this.salary * maxDTI) - this.monthlyDebt;
                    this.maxAffordablePayment = Math.max(0, Math.round(available));
                    const monthlyRate = (this.interestRate / 100) / 12;
                    const totalMonths = this.years * 12;
                    let maxLoan = monthlyRate === 0 ? available * totalMonths : available * ((1 - Math.pow(1 + monthlyRate, -totalMonths)) / monthlyRate);
                    this.totalPrice = Math.round(maxLoan / 0.8 / 10000 * 10) / 10;
                    this.updateResults();
                },
                updateResults() {
                    const maxDTI = 0.6;
                    this.maxAffordablePayment = Math.round((this.salary * maxDTI) - this.monthlyDebt);
                    const currentRatio = this.loanPercentage / 100;
                    const monthlyRate = (this.interestRate / 100) / 12;
                    const totalMonths = this.years * 12;
                    this.loanAmount = Math.round(this.totalPrice * currentRatio * 10) / 10;
                    const loanAmountRaw = this.loanAmount * 10000;
                    if (loanAmountRaw > 0 && totalMonths > 0) {
                        if (monthlyRate === 0) {
                            this.actualMonthlyPayment = Math.round(loanAmountRaw / totalMonths);
                        } else {
                            let factor = Math.pow(1 + monthlyRate, totalMonths);
                            this.actualMonthlyPayment = Math.round(loanAmountRaw * monthlyRate * factor / (factor - 1));
                        }
                    } else { this.actualMonthlyPayment = 0; }
                    this.downPayment = Math.round(this.totalPrice * (1 - currentRatio) * 10) / 10;
                    this.agentFee = Math.round(this.totalPrice * 0.02 * 10) / 10; 
                    this.totalCashNeeded = Math.round((this.downPayment + this.agentFee) * 10) / 10;
                }
            }
        }
    </script>
</body>
</html>
