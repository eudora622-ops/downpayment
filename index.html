<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購屋能力試算 | 台南寶家・徐甯恩</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPCS2EQRTC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-CPCS2EQRTC');

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?ixlib=rb-4.0.3&auto=format&fit=crop&w=2053&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a202c; /* 預防圖片載入前的深色背景 */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .input-label { display: block; color: #334155; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .input-field { 
            width: 100%; padding: 12px; 
            background-color: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 1.1rem; 
            outline: none; 
            transition: all 0.2s; 
        }
        .input-field:focus { 
            border-color: #b45309;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1); 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #b45309;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
        }
        .line-link {
            color: #4b5563;
            background-color: #e2e8f0;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
        }
        .line-link:hover {
            background-color: #79d03d;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn-gold {
            background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
            color: white;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(180, 83, 9, 0.3);
            transition: all 0.3s;
            text-align: center;
            display: block;
            width: 100%;
            cursor: pointer;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(180, 83, 9, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="fixed inset-0 bg-slate-900/70 z-0"></div>

    <div x-data="{ ...calculator(), showForm: false }" x-init="calculate()" class="relative z-10 w-full max-w-[480px]">
        
        <div class="flex flex-col items-center mb-8 text-center">
            
            <div class="w-32 h-auto mb-5 transform hover:scale-105 transition-transform duration-300">
                <img src="logo.png" alt="JIA LABEL Logo" class="w-full h-full object-contain drop-shadow-lg" onerror="this.parentElement.innerHTML='<span class=\'text-sm text-center text-red-400 bg-white/10 px-2 py-1 rounded\'>請上傳<br>logo.png</span>'">
            </div>
            
            <div class="mb-6">
                <p class="text-white/90 text-base font-medium tracking-wider drop-shadow-md">台南寶家・台灣房屋</p>
                <div class="flex justify-center items-center gap-4 mt-3">
                    <p class="text-amber-400 font-bold text-4xl tracking-widest drop-shadow-lg">徐甯恩</p>
                    <a href="https://line.me/ti/p/~eudora622" target="_blank" class="line-link shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-line mr-1" viewBox="0 0 16 16">
                          <path d="M8 0c4.418 0 8 3.582 8 8s-3.582 8-8 8-8-3.582-8-8 3.582-8 8-8zM4.97 5.433c.337 0 .608.276.608.616v2.793c0 .34-.271.616-.608.616H3.886c-.337 0-.608-.276-.608-.616V6.049c0-.34.271-.616.608-.616h1.084zm2.287 0c.337 0 .608.276.608.616v2.793c0 .34-.271.616-.608.616H6.173c-.337 0-.608-.276-.608-.616V6.049c0-.34.271-.616.608-.616h1.084zm2.286 0c.337 0 .608.276.608.616v2.793c0 .34-.271.616-.608.616H8.459c-.337 0-.608-.276-.608-.616V6.049c0-.34.271-.616.608-.616h1.084zm2.287 0c.337 0 .608.276.608.616v2.793c0 .34-.271.616-.608.616h-1.084c-.337 0-.608-.276-.608-.616V6.049c0-.34.271-.616.608-.616h1.084zm0 0c.337 0 .608.276.608.616v2.793c0 .34-.271.616-.608.616h-1.084c-.337 0-.608-.276-.608-.616V6.049c0-.34.271-.616.608-.616h1.084z"/>
                        </svg>
                        更多諮詢
                    </a>
                </div>
                <p class="text-slate-200 text-sm mt-3 font-normal tracking-wider drop-shadow">專營預售屋 / 新成屋 / 建商保留戶</p>
            </div>

            <h1 class="text-white text-3xl font-bold tracking-wide text-shadow drop-shadow-xl mt-2">購屋能力試算</h1>
            <div class="h-1.5 w-20 bg-gradient-to-r from-amber-500 to-amber-600 rounded-full mt-3 mx-auto"></div>
        </div>

        <div class="glass-card p-6 md:p-8">
            <div class="space-y-5">
                <div>
                    <label class="input-label">💰 目前月薪 (實領)</label>
                    <input type="number" x-model.number="salary" @input="calculate" class="input-field font-bold text-slate-700" placeholder="例如：60000">
                </div>
                <div>
                    <label class="input-label">💳 每月貸款支出 (車貸/信貸)</label>
                    <input type="number" x-model.number="monthlyDebt" @input="calculate" class="input-field" placeholder="例如：5000">
                </div>
                
                <div>
                    <label class="input-label">
                        📉 預計房貸利率 (%) 
                        <span class="text-xs text-red-500 font-normal ml-1">(房貸利率由個人條件有所不同)</span>
                    </label>
                    <input type="number" x-model.number="interestRate" @input="calculate" step="0.01" class="input-field" placeholder="預設 2.8">
                </div>

                <div class="pt-2">
                    <label class="input-label flex justify-between">
                        <span>🏦 預計貸款成數 (買方自備款)</span>
                        <span class="text-amber-700 font-bold" x-text="loanPercentage + ' 成'"></span>
                    </label>
                    <input type="range" min="50" max="85" step="5" x-model.number="loanPercentage" @input="calculate" class="w-full mt-2">
                    <p class="text-xs text-slate-400 text-right mt-1">
                        自備款比例：<span x-text="(100 - loanPercentage) + '%'"></span>
                    </p>
                </div>

                <div>
                    <label class="input-label flex justify-between">
                        <span>⏳ 貸款年限</span>
                        <span class="text-amber-700 font-bold" x-text="years + ' 年'"></span>
                    </label>
                    <input type="range" min="20" max="40" step="5" x-model.number="years" @input="calculate" class="w-full mt-2">
                </div>
            </div>

            <hr class="border-dashed border-slate-300 my-6">

            <div class="text-center">
                <p class="text-xs text-slate-500 uppercase tracking-widest mb-1">Estimated Budget</p>
                <h2 class="text-lg font-bold text-slate-700">建議房屋總價</h2>
                <div class="text-5xl font-extrabold text-slate-800 my-2 tracking-tight">
                    <span x-text="formatNumber(totalPrice)">0</span>
                    <span class="text-2xl text-slate-500 font-normal">萬</span>
                </div>
                
                <div class="bg-amber-50 rounded-xl p-4 mt-4 border border-amber-100">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-sm text-slate-500">建議準備自備款</span>
                        <span class="text-xl font-bold text-emerald-600" x-text="'$ ' + formatNumber(totalCashNeeded) + ' 萬'"></span>
                    </div>
                    <div class="text-xs text-slate-400 text-right">
                        (包含頭期款、2%仲介服務費，不含代書費及契稅雜項支出)
                    </div>
                </div>

                <div class="space-y-3 mt-4">
                    <div class="bg-slate-50 p-3 rounded-lg flex justify-between items-center">
                        <p class="text-sm text-slate-500">銀行核貸金額</p>
                        <p class="font-bold text-slate-700 text-lg" x-text="formatNumber(loanAmount) + ' 萬'"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 p-3 rounded-lg">
                            <p class="text-xs text-slate-400 mb-1">銀行建議月繳款<br>(上限)</p>
                            <p class="font-bold text-slate-600" x-text="'$' + formatNumber(maxAffordablePayment)"></p>
                        </div>
                        <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
                            <p class="text-xs text-amber-600/80 mb-1">核貸金額試算月繳<br>(本利和)</p>
                            <p class="font-bold text-amber-700" x-text="'$' + formatNumber(actualMonthlyPayment)"></p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button @click="showForm = true" class="btn-gold text-lg shadow-xl">
                        📝 索取更詳細的購屋評估
                    </button>
                    <p class="text-xs text-slate-400 mt-3">填寫需求，將由專人為您進行精準媒合</p>
                </div>
            </div>
            
            <div class="text-xs text-slate-500 space-y-1 mt-6 pt-4 border-t border-slate-200">
                <div class="flex justify-between">
                    <span>頭期款</span>
                    <span x-text="formatNumber(downPayment) + ' 萬'"></span>
                </div>
                <div class="flex justify-between">
                    <span>仲介服務費 (2%)</span>
                    <span x-text="formatNumber(agentFee) + ' 萬'"></span>
                </div>
            </div>
            
        </div>

        <div class="mt-10 text-center pb-8">
            <p class="text-white/70 text-sm font-light tracking-wider hover:text-white transition-colors flex justify-center items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-geo-alt-fill mr-1" viewBox="0 0 16 16">
                  <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                </svg>
                台南市北區北安路一段271號
            </p>
            <div class="w-12 h-[1px] bg-white/20 mx-auto my-4"></div>
            <p class="text-white/40 text-xs font-light">
                © 2025 Jia Label. All Rights Reserved.
            </p>
        </div>

        <div x-show="showForm" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center px-4" x-transition.opacity>
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" @click="showForm = false"></div>
            
            <div class="bg-white rounded-2xl w-full max-w-md relative z-10 p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                <button @click="showForm = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <h3 class="text-xl font-bold text-slate-800 mb-1">詳細購屋需求評估</h3>
                <p class="text-sm text-slate-500 mb-4">請填寫您的需求，我們將為您尋找最適合的物件。</p>

                <form action="https://formspree.io/f/mpqznezj" method="POST" class="space-y-3">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">姓名 *</label>
                            <input type="text" name="姓名" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">電話 *</label>
                            <input type="tel" name="電話" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">LINE ID</label>
                        <input type="text" name="LineID" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">想購買的區域</label>
                        <input type="text" name="購買區域" placeholder="例如：北區、安南區" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">預算總價 (萬)</label>
                            <input type="text" name="預算總價" placeholder="例如：1500-2000" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">預計自備款 (萬)</label>
                            <input type="text" name="預計自備款" placeholder="例如：300" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">偏好房型</label>
                            <select name="房型" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none bg-white">
                                <option value="大樓/華廈">大樓/華廈</option>
                                <option value="透天/別墅">透天/別墅</option>
                                <option value="公寓">公寓</option>
                                <option value="不限">不限</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">屋齡區間</label>
                            <select name="屋齡" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none bg-white">
                                <option value="預售屋">預售屋</option>
                                <option value="新成屋(5年內)">新成屋(5年內)</option>
                                <option value="中古屋(10-20年)">中古屋(10-20年)</option>
                                <option value="不限">不限</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">其他備註需求</label>
                        <textarea name="備註" rows="2" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:border-amber-500 outline-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transition-colors mt-2 text-base">
                        送出資料
                    </button>
                </form>
                </div>
        </div>

    </div>

    <script>
        function calculator() {
            return {
                salary: 60000,
                monthlyDebt: 0,
                loanPercentage: 80, 
                years: 30,
                interestRate: 2.8, 

                totalPrice: 0,
                loanAmount: 0,
                maxAffordablePayment: 0, 
                actualMonthlyPayment: 0, 
                totalCashNeeded: 0,
                downPayment: 0,
                agentFee: 0,

                formatNumber(num) {
                    if(num > 1000) return new Intl.NumberFormat('zh-TW').format(Math.round(num));
                    return new Intl.NumberFormat('zh-TW').format(Math.round(num * 10) / 10);
                },

                calculate() {
                    const maxDTI = 0.6;
                    let available = (this.salary * maxDTI) - this.monthlyDebt;
                    if (available < 0) available = 0;
                    this.maxAffordablePayment = Math.round(available);

                    let rateInput = this.interestRate || 0;
                    const monthlyRate = (rateInput / 100) / 12;
                    const totalMonths = this.years * 12;
                    
                    if (totalMonths === 0) return;

                    let maxPrincipalRaw = 0;
                    if (monthlyRate === 0) {
                        maxPrincipalRaw = available * totalMonths;
                    } else {
                        maxPrincipalRaw = available * ((1 - Math.pow(1 + monthlyRate, -totalMonths)) / monthlyRate);
                    }
                    
                    let baseMaxLoan = maxPrincipalRaw;
                    let baseMaxPrice = baseMaxLoan / 0.8; 

                    let currentRatio = this.loanPercentage / 100;
                    
                    this.totalPrice = Math.round(baseMaxPrice / 10000 * 10) / 10;
                    this.loanAmount = Math.round((this.totalPrice * 10000 * currentRatio) / 10000 * 10) / 10;
                    
                    let loanAmountRaw = this.loanAmount * 10000;
                    
                    if (loanAmountRaw > 0) {
                        if (monthlyRate === 0) {
                            this.actualMonthlyPayment = Math.round(loanAmountRaw / totalMonths);
                        } else {
                            let factor = Math.pow(1 + monthlyRate, totalMonths);
                            this.actualMonthlyPayment = Math.round(loanAmountRaw * monthlyRate * factor / (factor - 1));
                        }
                    } else {
                        this.actualMonthlyPayment = 0;
                    }

                    this.downPayment = Math.round((this.totalPrice * (1 - currentRatio)) * 10) / 10;
                    this.agentFee = Math.round((this.totalPrice * 0.02) * 10) / 10; 
                    
                    this.totalCashNeeded = Math.round((this.downPayment + this.agentFee) * 10) / 10; 
                }
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
             const calculatorElement = document.querySelector('[x-data]');
             if (calculatorElement && calculatorElement.__x) {
                calculatorElement.__x.$data.calculate();
             }
        });
    </script>
</body>
</html>
